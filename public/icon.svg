<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#FAF6EC"/>
  <g fill="none" stroke="#6B1E2A" stroke-width="4">
    <circle cx="256" cy="256" r="44"/>
  </g>
  <circle cx="256" cy="256" r="18" fill="#6B1E2A"/>
  <g fill="none" stroke="#B8893E" stroke-width="3.5">
    <g>
      <!-- 12 ghungroo bells around a mandala -->
      <g id="spokes">
        <line x1="256" y1="168" x2="256" y2="112"/>
        <circle cx="256" cy="98" r="18"/>
        <circle cx="256" cy="98" r="6" fill="#B8893E" stroke="none"/>
      </g>
      <use href="#spokes" transform="rotate(30 256 256)"/>
      <use href="#spokes" transform="rotate(60 256 256)"/>
      <use href="#spokes" transform="rotate(90 256 256)"/>
      <use href="#spokes" transform="rotate(120 256 256)"/>
      <use href="#spokes" transform="rotate(150 256 256)"/>
      <use href="#spokes" transform="rotate(180 256 256)"/>
      <use href="#spokes" transform="rotate(210 256 256)"/>
      <use href="#spokes" transform="rotate(240 256 256)"/>
      <use href="#spokes" transform="rotate(270 256 256)"/>
      <use href="#spokes" transform="rotate(300 256 256)"/>
      <use href="#spokes" transform="rotate(330 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="210" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
